<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js 三维地球</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { color: #eff9ff; background: #020815; font-family: Inter, "Segoe UI", sans-serif; }
    canvas { display: block; touch-action: none; }
    .panel, .coordinates {
      position: fixed; z-index: 1; border: 1px solid rgb(124 211 252 / 16%);
      background: rgb(3 15 30 / 66%); backdrop-filter: blur(18px);
    }
    .panel { top: 24px; left: 24px; width: min(360px, calc(100vw - 48px)); padding: 22px; border-radius: 20px; }
    .eyebrow { margin: 0 0 8px; color: #66d9ff; font-size: .72rem; font-weight: 700; letter-spacing: .18em; }
    h1 { margin: 0; font-size: 2.4rem; letter-spacing: -.04em; }
    .description { margin: 12px 0 20px; color: #b7cddd; font-size: .92rem; line-height: 1.65; }
    .actions { display: flex; gap: 10px; }
    button { min-height: 40px; padding: 0 15px; border: 1px solid rgb(125 211 252 / 22%); border-radius: 11px; color: #eaf9ff; background: rgb(9 67 96 / 62%); cursor: pointer; }
    button:hover { background: rgb(12 98 137 / 80%); }
    .coordinates { right: 24px; bottom: 24px; display: grid; gap: 4px; min-width: 220px; padding: 14px 17px; border-radius: 14px; pointer-events: none; }
    .coordinates span { color: #7dd3fc; font-size: .7rem; font-weight: 700; }
    .coordinates strong { font-family: "Cascadia Code", Consolas, monospace; font-size: .85rem; font-weight: 500; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <section class="panel">
    <p class="eyebrow">THREE.JS LAB</p>
    <h1>三维地球</h1>
    <p class="description">拖动旋转，滚轮缩放。所有视角操作始终以球心为中心。</p>
    <div class="actions">
      <button id="toggle" type="button">暂停自转</button>
      <button id="reset" type="button">复位视角</button>
    </div>
  </section>
  <div class="coordinates">
    <span>指针位置</span>
    <strong id="position">尚未选中球面</strong>
  </div>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020815);
    scene.fog = new THREE.FogExp2(0x020815, 0.035);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x243b55, 0.5));

    const sun = new THREE.DirectionalLight(0xfff4dc, 3.8);
    sun.position.set(5, 2.5, 4);
    sun.target.position.set(0, 0, 0);
    scene.add(sun, sun.target);

    const rim = new THREE.DirectionalLight(0x2f9dff, 0.75);
    rim.position.set(-4, 1, -3);
    scene.add(rim);

    const globe = new THREE.Group();
    scene.add(globe);

    const texture = new THREE.TextureLoader().load(
      'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'
    );
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const earth = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 96, 64),
      new THREE.MeshPhysicalMaterial({
        map: texture,
        roughness: 0.68,
        metalness: 0,
        clearcoat: 0.18,
        clearcoatRoughness: 0.45
      })
    );
    globe.add(earth);

    globe.add(new THREE.LineSegments(
      new THREE.WireframeGeometry(new THREE.SphereGeometry(1.505, 32, 20)),
      new THREE.LineBasicMaterial({ color: 0x61dafb, transparent: true, opacity: 0.06 })
    ));

    globe.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.57, 64, 32),
      new THREE.MeshBasicMaterial({
        color: 0x2bbcff, side: THREE.BackSide, transparent: true,
        opacity: 0.09, blending: THREE.AdditiveBlending
      })
    ));

    const starPositions = new Float32Array(1600 * 3);
    for (let i = 0; i < 1600; i += 1) {
      const radius = 12 + Math.random() * 28;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      starPositions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
      starPositions[i * 3 + 1] = radius * Math.cos(phi);
      starPositions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    scene.add(new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({ color: 0x9ad9ff, size: 0.035 })
    ));

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const output = document.querySelector('#position');
    const drag = { active: false, pointerId: null, x: 0, y: 0 };

    renderer.domElement.addEventListener('pointermove', (event) => {
      if (drag.active && event.pointerId === drag.pointerId) {
        const deltaX = event.clientX - drag.x;
        const deltaY = event.clientY - drag.y;
        globe.rotation.y += deltaX * 0.006;
        globe.rotation.x = THREE.MathUtils.clamp(
          globe.rotation.x + deltaY * 0.006,
          -Math.PI / 2,
          Math.PI / 2
        );
        drag.x = event.clientX;
        drag.y = event.clientY;
      }

      pointer.x = event.clientX / innerWidth * 2 - 1;
      pointer.y = -(event.clientY / innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hit = raycaster.intersectObject(earth)[0];

      if (!hit) {
        output.textContent = '尚未选中球面';
        return;
      }

      const point = globe.worldToLocal(hit.point.clone()).normalize();
      const lat = THREE.MathUtils.radToDeg(Math.asin(point.y));
      const lon = THREE.MathUtils.radToDeg(Math.atan2(point.z, -point.x));
      output.textContent = `${lat.toFixed(2)} deg, ${lon.toFixed(2)} deg`;
    });

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (event.button !== 0) return;
      drag.active = true;
      drag.pointerId = event.pointerId;
      drag.x = event.clientX;
      drag.y = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    const stopDragging = (event) => {
      if (event.pointerId !== drag.pointerId) return;
      drag.active = false;
      drag.pointerId = null;
    };
    renderer.domElement.addEventListener('pointerup', stopDragging);
    renderer.domElement.addEventListener('pointercancel', stopDragging);

    renderer.domElement.addEventListener('wheel', (event) => {
      event.preventDefault();
      const distance = THREE.MathUtils.clamp(
        camera.position.length() * Math.exp(event.deltaY * 0.001),
        2.3,
        11
      );
      camera.position.setLength(distance);
      camera.lookAt(0, 0, 0);
    }, { passive: false });

    let rotating = true;
    const toggle = document.querySelector('#toggle');
    toggle.addEventListener('click', () => {
      rotating = !rotating;
      toggle.textContent = rotating ? '暂停自转' : '继续自转';
    });

    document.querySelector('#reset').addEventListener('click', () => {
      camera.position.set(0, 1.2, 5);
      camera.lookAt(0, 0, 0);
      globe.rotation.set(0, 0, 0);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const delta = Math.min(clock.getDelta(), 0.05);
      if (rotating) globe.rotation.y += delta * 0.09;
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
