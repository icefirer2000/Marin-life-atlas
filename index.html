<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="使用 Three.js、Natural Earth 与鱼类时空档案构建的可交互三维地球"
    />
    <title>海错图项目 v1.9</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <div class="panel">
        <p class="eyebrow">THREE.JS LAB</p>
        <h1>海错图</h1>
        <p class="description">
          真实大陆底图、鱼类图鉴与年度分布轨迹共同构成可交互的海洋生命地图。
        </p>
        <div class="actions">
          <button id="toggle-rotation" type="button">暂停自转</button>
          <button id="reset-camera" type="button">复位视角</button>
        </div>

        <section
          id="fish-panel"
          class="fish-panel"
          aria-live="polite"
          aria-hidden="true"
        >
          <button
            id="close-fish-panel"
            class="fish-panel__close"
            type="button"
            aria-label="关闭鱼类图鉴"
          >
            ×
          </button>
          <p class="eyebrow">SPECIES ATLAS</p>
          <div class="fish-panel__header">
            <div id="fish-illustration" class="fish-illustration"></div>
            <div>
              <h2 id="fish-name">鱼类名称</h2>
              <p id="fish-scientific-name" class="scientific-name"></p>
            </div>
          </div>
          <p id="fish-summary"></p>
          <dl class="continent-facts fish-facts">
            <div>
              <dt>分类</dt>
              <dd id="fish-taxonomy"></dd>
            </div>
            <div>
              <dt>栖息地</dt>
              <dd id="fish-habitat"></dd>
            </div>
            <div>
              <dt>当前记录</dt>
              <dd id="fish-record-detail"></dd>
            </div>
            <div>
              <dt>时间轨迹</dt>
              <dd id="fish-track-detail"></dd>
            </div>
          </dl>
        </section>
      </div>

      <div class="coordinates" aria-live="polite">
        <span>指针位置</span>
        <strong id="pointer-position">尚未选中球面</strong>
        <small id="pointer-position-decimal"></small>
      </div>

      <div id="continent-labels" class="continent-labels"></div>
      <div id="fish-labels" class="fish-labels"></div>

      <aside class="layer-panel" aria-labelledby="layer-panel-title">
        <p class="eyebrow">MAP LAYERS</p>
        <h2 id="layer-panel-title">图层显示</h2>
        <div id="layer-options" class="layer-options"></div>
        <section class="fish-controls" aria-labelledby="fish-controls-title">
          <p id="fish-controls-title" class="control-title">鱼类时间档案</p>
          <label class="control-field">
            <span>目标鱼类</span>
            <select id="fish-species-select"></select>
          </label>
          <label class="control-field">
            <span>显示年份 <strong id="fish-year-output">2024</strong></span>
            <input
              id="fish-year-slider"
              type="range"
              min="2000"
              max="2024"
              step="1"
              value="2024"
            />
          </label>
          <label class="control-field fish-track-control">
            <span>轨迹起点 <strong id="fish-track-start-output">2000</strong></span>
            <input
              id="fish-track-start-slider"
              type="range"
              min="2000"
              max="2024"
              step="1"
              value="2000"
            />
          </label>
          <label class="control-field fish-track-control">
            <span>轨迹终点 <strong id="fish-track-end-output">2024</strong></span>
            <input
              id="fish-track-end-slider"
              type="range"
              min="2000"
              max="2024"
              step="1"
              value="2024"
            />
          </label>
          <p id="fish-status" class="fish-status">
            鱼类图鉴已关闭；开启后显示年度节点与轨迹
          </p>
        </section>
        <p id="terrain-status" class="terrain-status">
          选择一个大陆以加载地形
        </p>
        <p class="data-credit">
          DEM:
          <a
            href="https://registry.opendata.aws/terrain-tiles/"
            target="_blank"
            rel="noreferrer"
          >
            Mapzen Terrain Tiles / AWS Open Data
          </a>
        </p>
      </aside>

      <aside
        id="continent-panel"
        class="continent-panel"
        aria-live="polite"
        aria-hidden="true"
      >
        <button
          id="close-continent-panel"
          class="continent-panel__close"
          type="button"
          aria-label="关闭大陆信息"
        >
          ×
        </button>
        <p class="eyebrow">CONTINENT PROFILE</p>
        <h2 id="continent-name">大陆名称</h2>
        <p id="continent-summary"></p>
        <dl class="continent-facts">
          <div>
            <dt>面积</dt>
            <dd id="continent-area"></dd>
          </div>
          <div>
            <dt>人口</dt>
            <dd id="continent-population"></dd>
          </div>
          <div>
            <dt>主要特征</dt>
            <dd id="continent-feature"></dd>
          </div>
          <div>
            <dt>地形数据</dt>
            <dd id="continent-terrain-status">点击大陆后按需加载</dd>
          </div>
        </dl>
      </aside>

      <div
        id="scene"
        aria-label="可交互的三维地球、大陆表面与经纬网"
      ></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
